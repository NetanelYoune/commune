
name: Deploy Commune

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: commune-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'NetanelYoune/commune'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::489205147035:role/Commune-GitHub-Deploy-Role
          aws-region: eu-north-1

      - name: Deploy using Systems Manager
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re

          sha = os.environ["DEPLOY_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise ValueError("Invalid commit SHA")

          command = f"""#!/bin/bash
          set -euo pipefail
          sudo -u ubuntu bash -c '
          set -euo pipefail
          cd /home/ubuntu/commune
          git fetch origin main
          git reset --hard {sha}
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          '
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:9000/api/health
          """

          payload = {
              "commands": [command],
              "executionTimeout": ["1500"]
          }

          with open("ssm-parameters.json", "w") as file:
              json.dump(payload, file)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0650d01b9348d7950 \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 60 \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command sent: $COMMAND_ID"

          for attempt in $(seq 1 150); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0650d01b9348d7950 \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded"
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0650d01b9348d7950 || true
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 150 ]; then
              echo "Deployment wait timed out"
              exit 1
            fi

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0650d01b9348d7950 \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
