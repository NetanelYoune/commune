name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t commune-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t commune-web:ci .

      - name: Build Realtime image
        run: docker build -f apps/realtime/Dockerfile -t commune-realtime:ci .
